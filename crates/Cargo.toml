[package]
name = "prism_accelerate"
version = "0.1.0"
edition = "2021"

[lib]
# setuptools-rust renames the built artifact to the ext-module target declared
# in pyproject.toml (prism._accelerate); this is just the crate name.
name = "_accelerate"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Direct pins constrain only our slot. Transitive picks by numpy, pyo3, and
# indexmap still float to the latest in-range and duplicate types against
# qiskit-circuit's pinned versions. See README for the resolution mechanics.
[features]
default = ["extension-module"]
# Gate `extension-module` so `cargo test` can link libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["abi3-py310", "smallvec", "hashbrown", "indexmap", "num-complex", "num-bigint", "py-clone", "multiple-pymethods"] }
numpy = "=0.27.1"
ndarray = "=0.16.1"
nalgebra = "=0.33.3"
hashbrown = "=0.15.5"
indexmap = ">=2.10, <2.12"  # 2.12+ requires hashbrown ^0.16.
smallvec = { version = "=1.15.1", features = ["union"] }
rand = { version = "=0.9.2", features = ["small_rng"] }
rand_pcg = "=0.9.0"
rayon = "=1.11.0"
rayon-cond = "=0.4.0"
rustworkx-core = "=0.17.1"
thiserror = "=2.0.18"
num-complex = "=0.4.6"
ahash = "=0.8.12"

qiskit-circuit = { git = "https://github.com/Qiskit/qiskit", tag = "2.3.1" }
qiskit-transpiler = { git = "https://github.com/Qiskit/qiskit", tag = "2.3.1" }

# Patches replace the registry entry globally and force a single version
# everywhere, which direct pins cannot do for transitive deps.
[patch.crates-io]
ndarray = { git = "https://github.com/rust-ndarray/ndarray", tag = "0.16.1" }
hashbrown = { git = "https://github.com/rust-lang/hashbrown", tag = "v0.15.5" }
nalgebra = { git = "https://github.com/dimforge/nalgebra", tag = "v0.33.3" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
