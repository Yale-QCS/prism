[package]
name = "prism_accelerate"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
# setuptools-rust renames the built artifact to the ext-module target declared
# in pyproject.toml (prism._accelerate); this is just the crate name.
name = "_accelerate"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
# Gate `extension-module` so `cargo test` can link libpython.
extension-module = ["pyo3/extension-module"]

# Requirements mirror Qiskit 2.6.0rc1's `[workspace.dependencies]`; exact versions come from
# `Cargo.lock`, which is seeded from Qiskit's own lockfile at the same tag (see README).
[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "smallvec", "hashbrown", "indexmap", "num-complex", "num-bigint", "py-clone"] }
numpy = "0.29"
ndarray = "0.17"
hashbrown = "0.15.5"
smallvec = { version = "1.15", features = ["union"] }
rand = "0.10"
rand_pcg = "0.10"
rayon-cond = "0.4"
rustworkx-core = "0.18"
thiserror = "2.0"

qiskit-circuit = { git = "https://github.com/Qiskit/qiskit", tag = "2.6.0rc1" }
qiskit-transpiler = { git = "https://github.com/Qiskit/qiskit", tag = "2.6.0rc1" }
qiskit-util = { git = "https://github.com/Qiskit/qiskit", tag = "2.6.0rc1", features = ["py"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_pub_crate = "warn"
items_after_statements = "warn"
fn_params_excessive_bools = "warn"
float_cmp = "warn"
suspicious_operation_groupings = "deny"
unreadable_literal = "warn"
doc_markdown = "warn"
too_many_lines = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
