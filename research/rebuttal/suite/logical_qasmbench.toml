# Logical-SABRE context arm on the QASMBench suite circuits, each at its own width (suite/README.md).
# knn on heavy-hex is not placeable: the 57-site lattice has a maximum matching of 24 rail pairs.
experiment_id = "logical"
objective = "error"
reschedule = true
widths = []
# Seeds are 100 apart: a run's random layout starts use seeds base..base+42,
# so closer seeds share starts and are not independent.
seeds = [
  0, 100, 200, 300, 400,
  500, 600, 700, 800, 900,
  1000, 1100, 1200, 1300, 1400,
  1500, 1600, 1700, 1800, 1900,
]
topologies = ["grid", "hex_lattice", "heavy_hex"]
arms = ["logical"]
circuits = ["sat", "seca", "multiply", "gcm_h6", "qec9xz", "qram", "knn"]

[circuit_widths]
sat = [11]
seca = [11]
multiply = [13]
gcm_h6 = [13]
qec9xz = [17]
qram = [20]
knn = [25]
