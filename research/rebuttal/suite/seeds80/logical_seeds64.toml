# Logical-SABRE context arm at the 44 added seeds (2000 to 6300, 100 apart) of the 64-seed suite (README.md, 2026-10-11 note):
# the 16 MQT workloads at n = 8 (logical.toml) and the 8 QASMBench workloads at their own widths (gcm_h6 excluded,
# ../README.md). Same settings as configs/paper/logical.toml and ../logical_qasmbench.toml. knn on heavy-hex is not placeable.
experiment_id = "logical_seeds64"
objective = "error"
reschedule = true
widths = [8]
# Seeds are 100 apart: a run's random layout starts use seeds base..base+42,
# so closer seeds share starts and are not independent.
seeds = [2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900, 3000, 3100, 3200, 3300, 3400, 3500, 3600, 3700, 3800, 3900, 4000, 4100, 4200, 4300, 4400, 4500, 4600, 4700, 4800, 4900, 5000, 5100, 5200, 5300, 5400, 5500, 5600, 5700, 5800, 5900, 6000, 6100, 6200, 6300]
topologies = ["grid", "hex_lattice", "heavy_hex"]
arms = ["logical"]
circuits = [
  "dj",
  "qaoa",
  "draper_qft_adder",
  "modular_adder",
  "qft",
  "qpeexact",
  "qpeinexact",
  "qftentangled",
  "bmw_quark_copula",
  "hhl",
  "ae",
  "cdkm_ripple_carry_adder",
  "vbe_ripple_carry_adder",
  "vqe_two_local",
  "rg_qft_multiplier",
  "multiplier",
  "sat",
  "seca",
  "multiply",
  "qec9xz",
  "qram",
  "knn",
  "qf21",
  "bv",
]

[circuit_widths]
sat = [11]
seca = [11]
multiply = [13]
qec9xz = [17]
qram = [20]
knn = [25]
qf21 = [15]
bv = [19]
