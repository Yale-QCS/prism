# Logical-SABRE at Greedy/PRISM's search budget (revision 3, R1): the cells of research/rebuttal/suite/seeds80/logical_randomcircuit.toml,
# with the quotient-graph SabreLayout at 40 random starts (plus dense, identity, reverse), 16 forward-backward
# iterations and 40 swap trials. Nothing else differs from research/rebuttal/suite/seeds80/logical_randomcircuit.toml.
# Logical-SABRE context arm on randomcircuit at all 64 suite seeds (0 to 1900 and 2000 to 6300), for the
# --with-randomcircuit variant of scripts/paper/export_suite.py. Same settings as configs/paper/logical.toml.
experiment_id = "logical_randomcircuit_budget"
layout_starts = 40
refinement_iterations = 16
prism_swap_trials = 40
objective = "error"
reschedule = true
widths = [8]
# Seeds are 100 apart: a run's random layout starts use seeds base..base+42,
# so closer seeds share starts and are not independent.
seeds = [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900, 3000, 3100, 3200, 3300, 3400, 3500, 3600, 3700, 3800, 3900, 4000, 4100, 4200, 4300, 4400, 4500, 4600, 4700, 4800, 4900, 5000, 5100, 5200, 5300, 5400, 5500, 5600, 5700, 5800, 5900, 6000, 6100, 6200, 6300]
topologies = ["grid", "hex_lattice", "heavy_hex"]
arms = ["logical"]
circuits = ["randomcircuit"]
