# Logical-SABRE at Greedy/PRISM's search budget (revision 3, R1): the cells of research/rebuttal/suite/logical_added.toml,
# with the quotient-graph SabreLayout at 40 random starts (plus dense, identity, reverse), 16 forward-backward
# iterations and 40 swap trials. Nothing else differs from research/rebuttal/suite/logical_added.toml.
# Logical-SABRE context arm on the three QASMBench circuits the mechanical rule adds, each at its own width (suite/README.md).
experiment_id = "logical_added_budget"
layout_starts = 40
refinement_iterations = 16
prism_swap_trials = 40
objective = "error"
reschedule = true
widths = []
# Seeds are 100 apart: a run's random layout starts use seeds base..base+42,
# so closer seeds share starts and are not independent.
seeds = [
  0, 100, 200, 300, 400,
  500, 600, 700, 800, 900,
  1000, 1100, 1200, 1300, 1400,
  1500, 1600, 1700, 1800, 1900,
]
topologies = ["grid", "hex_lattice", "heavy_hex"]
arms = ["logical"]
circuits = ["qf21", "bv"]  # cc is left out: every arm fails on it (suite/README.md, clause 3)

[circuit_widths]
qf21 = [15]
bv = [19]
