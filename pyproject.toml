[build-system]
requires = ["setuptools", "wheel", "setuptools_rust"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-compiler"
description = "transpiler for dual-rail multi-realization gate sets"
version = "0.1.0"
authors = [{ name = "evmckinney9" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=2.5,<2.6",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/evmckinney9/prism"
Repository = "https://github.com/evmckinney9/prism"
Issues = "https://github.com/evmckinney9/prism/issues"

[project.optional-dependencies]
format = ["pre-commit", "ruff"]
test = ["pytest"]
eval = ["mqt.bench==2.2.2", "matplotlib"]  # benchmark circuits for the QEC and mqt.bench scripts
docs = [
    "sphinx",
    "furo",
    "nbsphinx",
    "ipykernel",
    "pypandoc_binary", # bundles the pandoc binary nbsphinx needs
]
dev = [
    "prism[format,test,docs,eval]",
    "pylatexenc",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism*"]

[tool.ruff]
target-version = "py312"
fix = true
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["D", "ANN"]
ignore = [
    "D105",   # magic methods like __init__ don't need docstrings
    "ANN401", # Any is legitimate at FFI / numpy seams
    "ANN002", # *args doesn't need type annotations
    "ANN003", # **kwargs doesn't need type annotations
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D", "ANN"]
"src/tests/**/*.py" = ["D1", "ANN"]
"**/*.ipynb" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module nested into the Python package
# https://github.com/PyO3/setuptools-rust
target = "prism._accelerate"
path = "crates/Cargo.toml"
binding = "PyO3"
debug = false

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"
