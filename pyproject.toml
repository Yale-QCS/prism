[build-system]
requires = ["setuptools", "wheel", "setuptools_rust"]
build-backend = "setuptools.build_meta"

[project]
name = "marabbecca"
description = "Research artifact for PRISM, a Qiskit compiler that binds dual-rail gate realizations at routing time."
version = "0.1.0"
authors = [{ name = "Evan McKinney", email = "evmckinney9@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantum", "compiler", "qiskit", "dual-rail", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["qiskit>=2.4.1,<2.5", "numpy", "tqdm"]

[tool.setuptools]
include-package-data = false

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"

[tool.setuptools.packages.find]
where = ["src"]
include = ["marabbecca", "marabbecca.*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/Yale-QCS/prism/tree/revision-r3"
Repository = "https://github.com/Yale-QCS/prism"
Issues = "https://github.com/Yale-QCS/prism/issues"
[project.optional-dependencies]
viz = ["matplotlib", "pylatexenc"]
format = ["pre-commit", "ruff"]
test = ["pytest"]
eval = ["mqt.bench==2.2.2"]
research = ["ipykernel", "ipywidgets", "lusca", "networkx", "qutip", "snakeviz"]
# Executes the paper figure notebooks (make figures). gulps 0.4 needs Qiskit 2.5.
paper = ["marabbecca[viz]", "lusca", "nbclient", "nbformat", "ipykernel", "gulps==0.3.6", "scipy"]
dev = ["marabbecca[format,test,viz,eval,research,paper]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "error",
    # Module-level notice in marabbecca.utils.quotient, raised on every import.
    "ignore:marabbecca.utils.quotient:UserWarning",
]

[tool.ruff]
extend-exclude = ["research"]
target-version = "py310"

[tool.ruff.lint]
select = ["D", "ANN", "F", "I"]
ignore = [
    "D105",   # magic methods like __init__ don't need docstrings
    "ANN401", # Any is legitimate at the PyO3 FFI / numpy / Qiskit seam
    "ANN002", # *args doesn't need type annotations
    "ANN003", # **kwargs doesn't need type annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1", "ANN"]
"scripts/**" = ["D", "ANN"] # evaluation pipeline, not the library
"src/notebooks/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.setuptools-rust.ext-modules]]
target = "marabbecca._accelerate"
path = "crates/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
cargo-manifest-args = ["--locked"]
debug = false
