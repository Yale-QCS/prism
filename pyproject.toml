[build-system]
requires = ["setuptools>=77", "setuptools_rust"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-qc"
description = "A Qiskit transpiler for dual-rail qubits that binds each gate's realization at routing time."
version = "0.1.0rc1"
authors = [{ name = "Evan McKinney", email = "evmckinney9@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantum", "compiler", "qiskit", "dual-rail", "routing", "erasure-qubits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["qiskit~=2.6.0", "numpy"]

[tool.setuptools]
include-package-data = false

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism", "prism.*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/evmckinney9/prism"
Repository = "https://github.com/evmckinney9/prism"
Issues = "https://github.com/evmckinney9/prism/issues"
[project.optional-dependencies]
format = ["pre-commit", "ruff"]
test = ["pytest"]
dev = ["prism-qc[format,test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["D", "F", "I", "UP"]
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.setuptools-rust.ext-modules]]
target = "prism._accelerate"
path = "crates/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
cargo-manifest-args = ["--locked"]
debug = false
