[build-system]
requires = ["setuptools", "wheel", "setuptools_rust"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-compiler"
description = "A Qiskit transpiler for dual-rail qubits that binds each gate's realization at routing time."
version = "0.1.0"
authors = [{ name = "Evan McKinney", email = "evmckinney9@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantum", "compiler", "qiskit", "dual-rail", "routing", "erasure-qubits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["qiskit>=2.5,<2.6", "numpy"]

[tool.setuptools]
include-package-data = false

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism", "prism.*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/Yale-QCS/prism"
Documentation = "https://yale-qcs.github.io/prism/"
Repository = "https://github.com/Yale-QCS/prism"
Issues = "https://github.com/Yale-QCS/prism/issues"
[project.optional-dependencies]
viz = ["matplotlib", "pylatexenc"]
format = ["pre-commit", "ruff"]
test = ["pytest"]
eval = ["mqt.bench==2.2.2", "prism-compiler[viz]"] # benchmark circuits for the QEC and mqt.bench scripts
docs = [
    "prism-compiler[viz]",
    "sphinx",
    "jupyter-sphinx",
    "myst-parser",
    "ipykernel",
    "sphinx-autobuild",
    "sphinx-copybutton>=0.5,<1",
    "sphinx-sitemap>=2.9,<3",
    "qiskit-sphinx-theme>=2",
]
dev = ["prism-compiler[format,test,docs,eval]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
extend-exclude = ["dev"]
target-version = "py310"

[tool.ruff.lint]
select = ["D", "ANN", "F", "I"]
ignore = [
    "D105",   # magic methods like __init__ don't need docstrings
    "ANN401", # Any is legitimate at the PyO3 FFI / numpy / Qiskit seam
    "ANN002", # *args doesn't need type annotations
    "ANN003", # **kwargs doesn't need type annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1", "ANN"]
"src/notebooks/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.setuptools-rust.ext-modules]]
target = "prism._accelerate"
path = "crates/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
cargo-manifest-args = ["--locked"]
debug = false
