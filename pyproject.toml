[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.7"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-qc"
description = "A Qiskit transpiler for dual-rail qubits that binds each gate's realization at routing time."
version = "0.1.0rc1"
authors = [{ name = "Evan McKinney", email = "evmckinney9@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["quantum", "compiler", "qiskit", "dual-rail", "routing", "erasure-qubits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["qiskit~=2.6.0", "numpy"]

[tool.setuptools]
include-package-data = false

[tool.distutils.bdist_wheel]
py_limited_api = "cp310"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism_qc", "prism_qc.*"]
namespaces = false

[project.urls]
Homepage = "https://github.com/Yale-QCS/prism"
Repository = "https://github.com/Yale-QCS/prism"
Issues = "https://github.com/Yale-QCS/prism/issues"
[project.optional-dependencies]
format = ["pre-commit", "ruff"]
test = ["pytest"]
dev = ["prism-qc[format,test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["D", "ANN", "B", "F", "I", "SIM", "UP"]
ignore = [
    "D102",   # methods such as `run` are documented by their class
    "D105",   # magic methods like __init__ don't need docstrings
    "D107",
    "ANN401", # Any is legitimate at the Qiskit seam
    "ANN002", # *args doesn't need type annotations
    "ANN003", # **kwargs doesn't need type annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.setuptools-rust.ext-modules]]
target = "prism_qc._accelerate"
path = "crates/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
cargo-manifest-args = ["--locked"]
debug = false
