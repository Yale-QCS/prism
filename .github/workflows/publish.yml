name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - run: gh release download "$TAG" --repo "$REPO" --pattern "*.whl" --pattern "*.tar.gz" --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
